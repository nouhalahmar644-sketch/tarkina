<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier Profil</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#1e1e1e;
  --grey:#7a7a7a;
  --border:#e6e6e6;
  --primary:#5aa7ff;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  margin:0;
  padding:40px;
}

.container{
  max-width:800px;
  margin:auto;
  background:var(--card);
  border-radius:16px;
  padding:30px;
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
}

h2{
  margin-bottom:20px;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:22px;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  font-size:13px;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:12px;
  border:1.5px solid var(--border);
  border-radius:8px;
}

.btn{
  margin-top:15px;
  padding:12px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:8px;
  width:100%;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

  <h2>Modifier mon profil</h2>

  <div class="avatar">JD</div>

  <form method="POST" action="update-profile.php">

    <div class="form-group">
      <label>Nom</label>
      <input type="text" name="nom" value="Doe">
    </div>

    <div class="form-group">
      <label>Prénom</label>
      <input type="text" name="prenom" value="John">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" value="john@email.com">
    </div>

    <div class="form-group">
      <label>Adresse</label>
      <input type="text" name="adresse" value="Tunis">
    </div>

    <button class="btn">Enregistrer les modifications</button>

  </form>

</div>

</body>
</html>
